<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#04141c">
  <meta name="description" content="Морской бой онлайн на двоих. Расставьте флот и потопите корабли соперника.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Морской бой</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="sea" aria-hidden="true"></canvas>
  <div class="app">
    <header class="top">
      <div class="brand">
        <div class="emblem" aria-hidden="true">
          <svg viewBox="0 0 36 36" width="26" height="26">
            <path d="M4 22h28l-3 5H7z" fill="#e7f4f6"/>
            <path d="M12 22V14h8v8" fill="#8eafb8"/>
            <rect x="22" y="12" width="2.4" height="10" fill="#f0d59a"/>
          </svg>
        </div>
        <div>
          <h1>МОРСКОЙ БОЙ</h1>
          <p>Ночной флот на двоих</p>
        </div>
      </div>
      <button class="icon-btn" id="sound" type="button" aria-pressed="false" aria-label="Звук">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M4 10h4l5-4v12l-5-4H4z"/>
          <path d="M16 9.5a4 4 0 0 1 0 5" class="wave"/>
          <path d="M18.5 7a7 7 0 0 1 0 10" class="wave"/>
        </svg>
      </button>
    </header>
    <main id="root"></main>
  </div>
  <div id="toast" class="toast" role="status"></div>
  <script src="vendor/peerjs.min.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
